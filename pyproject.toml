[project]
name = "ai-app"
version = "0.1.0"
description = ""
authors = [
    {name = "GaEun132",email = "rkdms5813@gmail.com"}
]
readme = "README.md"
requires-python = "<3.15,>=3.10"
dependencies = [
    "python-dotenv (>=1.1.1,<2.0.0)",
    "langchain (>=1.0.1,<2.0.0)",
    "langchain-openai (>=1.0.0,<2.0.0)",
    "fastapi (>=0.119.1,<0.120.0)",
    "pypdf (>=6.1.2,<7.0.0)",
    "langchain-community (>=0.4,<0.5)",
    "langchain-google-genai (>=3.0.0,<4.0.0)",
    "faiss-cpu (>=1.12.0,<2.0.0)",
    "uvicorn (>=0.38.0,<0.39.0)"
]

[tool.poetry]
name = "ai-app" 
version = "0.1.0"
packages = [{include = "ai_app", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ipykernel (>=7.0.1,<8.0.0)"
]
